[package]
name = "cafce"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.215", features = ["derive"] }
serde_either = "0.2.1"
toml = "0.8.19"
bpaf = { version = "0.9.26", features = ["derive", "autocomplete"] }
envy = "0.4.2"
aws-sdk-s3 = "=1.138.1"
aws-sdk-sts = "=1.108.0"
aws-config = { version = "=1.9.0", features = ["behavior-version-latest"] }
aws-smithy-types = "=1.6.1"
url = "2.5.8"
thiserror = "2.0.19"
anyhow = "1.0.104"
glob = "0.3.4"
sha2 = "0.10.9"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
log = "0.4.33"
env_logger = "0.11.11"
# アーカイブのバイト列が版数で変わらないよう、パッチバージョンまで固定する
tar = "=0.4.46"
zstd = "=0.13.3"
walkdir = "=2.5.0"
tempfile = "=3.27.0"

[profile.release]
debug = 1
